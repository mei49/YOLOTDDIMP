# TDD-YOLO baseline: layer rows identical to the authors' ultralytics/backbone/yolo_corfem_canaver_corcbam.yaml
# (LingShaQ/TDD-YOLOCode). Only the scale header differs: depth/width multiples instead of `scales`,
# equal to the authors' n scale [0.50, 0.25, 1024].
nc: 80 # overridden by the dataset
depth_multiple: 0.50
width_multiple: 0.25

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, co_FEM, [1024]] #   新的11  64-384  144
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4  13
  - [-1, 1, CBAM_cor, [8,7]]   #新14
  - [-1, 1, Averge_FEM, [512]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #16
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3  17
  - [-1, 1, CBAM_cor, [8,7]]  #18
  - [-1, 1, BackAverge_FEM, [256]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 15], 1, Concat, [1]] # cat head P4  21
  - [-1, 1, CBAM_cor, [8,7]]#xin 22
  - [-1, 1, Averge_FEM, [256]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]  #24
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 1, CBAM_cor, [8,7]] #26
  - [-1, 1, Averge_FEM, [512]] # 27 (P5/32-large)

  - [[19, 23, 27], 1, Detect, [nc]] # Detect(P3, P4, P5)
